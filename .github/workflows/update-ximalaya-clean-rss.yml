name: Update Ximalaya Clean RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate clean RSS
        run: python scripts/generate_ximalaya_clean_feed.py

      - name: Validate clean RSS
        run: |
          test -f public/ximalaya-clean/feed.xml
          ! grep -n "在小宇宙查看该单集文稿" public/ximalaya-clean/feed.xml
          ! grep -n "小宇宙查看该单集文稿" public/ximalaya-clean/feed.xml
          ! grep -n "xiaoyuzhoufm.com/player" public/ximalaya-clean/feed.xml
          ! grep -n "openTranscript" public/ximalaya-clean/feed.xml
          grep -n "<enclosure" public/ximalaya-clean/feed.xml
          grep -n "itunes:image" public/ximalaya-clean/feed.xml

      - name: Commit RSS update
        run: |
          if git diff --quiet -- public/ximalaya-clean/feed.xml; then
            echo "No RSS changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ximalaya-clean/feed.xml
          git commit -m "Update Ximalaya clean RSS"
          git push
