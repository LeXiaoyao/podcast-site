name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        run: |
          git clone --depth=1 --branch main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          git rev-parse HEAD

      - name: Set up Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies and build
        run: |
          cd repo
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Deploy dist to gh-pages branch
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          touch dist/.nojekyll

          rm -rf /tmp/gh-pages-worktree

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages-worktree origin/gh-pages
            cd /tmp/gh-pages-worktree
          else
            git worktree add --detach /tmp/gh-pages-worktree
            cd /tmp/gh-pages-worktree
            git checkout --orphan gh-pages
          fi

          # 清理 gh-pages 工作树。不要用 find 遍历删除，避免 node_modules no such file 报错。
          git rm -rf . || true

          shopt -s dotglob nullglob
          for item in *; do
            if [ "$item" != ".git" ]; then
              rm -rf "$item"
            fi
          done
          shopt -u dotglob nullglob

          cp -R /home/runner/work/podcast-site/podcast-site/repo/dist/. .

          git add -A
          git commit -m "Deploy site to GitHub Pages" || echo "No changes to deploy"
          git push origin HEAD:gh-pages --force
