name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        run: |
          git clone --depth=1 --branch main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          git rev-parse HEAD

      - name: Set up Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies and build
        run: |
          cd repo
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Deploy dist to gh-pages branch
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/podcast-site-dist
          cp -R dist /tmp/podcast-site-dist

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 \
            ! -name ".git" \
            ! -path "./.git/*" \
            -exec rm -rf {} +

          cp -R /tmp/podcast-site-dist/. .

          git add -A
          git commit -m "Deploy site to GitHub Pages" || echo "No changes to deploy"
          git push origin gh-pages --force
